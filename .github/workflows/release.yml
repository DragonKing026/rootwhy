---
name: release

# Builds rootwhy and rootwhy-gtk on Ubuntu 22.04 (glibc 2.35, GTK 4.6)
# for x86_64 and aarch64 and attaches them with SHA256SUMS
# to a draft GitHub release of the pushed tag.
"on":
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: GTK 4 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: rootwhy must not link GTK
        run: "! ldd target/release/rootwhy | grep -E 'libgtk|libgobject'"
      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir dist
          cp target/release/rootwhy "dist/rootwhy-linux-$ARCH"
          cp target/release/rootwhy-gtk "dist/rootwhy-gtk-linux-$ARCH"
      # v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rootwhy-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum rootwhy-* > SHA256SUMS && cat SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY" --title "$TAG"
          --verify-tag --draft
