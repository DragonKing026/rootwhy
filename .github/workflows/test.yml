---
name: test

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The oldest supported base: glibc 2.35, GTK 4.6 (same as the release).
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: GTK 4 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal \
            --component clippy,rustfmt
          rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Shell
        run: shellcheck -S warning install.sh
      - name: Plugin manifests are valid JSON
        run: |
          for f in .claude-plugin/*.json hooks/hooks.json; do
            python3 -m json.tool "$f" > /dev/null
          done
