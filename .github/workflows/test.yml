name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Tests
        run: python3 -m unittest discover -s tests -v
      - name: Lint
        run: pipx run ruff==0.17.1 check --select F,E9 rootwhy hooks tests
      - name: Plugin manifests are valid JSON
        run: for f in .claude-plugin/*.json hooks/hooks.json; do python3 -m json.tool "$f" > /dev/null; done
