---
name: fuzz

# Short cargo-fuzz run of every target in fuzz/ (the code that parses input from
# outside: hook JSON, shell words, command line). A crash fails the job and
# uploads the reproducer.
"on":
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [hook_decide, parse_args]
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: GTK 4 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev
      - name: Rust nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz (60 s)
        env:
          TARGET: ${{ matrix.target }}
        run: cargo fuzz run "$TARGET" -- -max_total_time=60
      # v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
